name: Build GRADE X Arena Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: ${{ github.workspace }}/Grade_X_arena_app

      - name: Prepare website files
        run: npm run build
        working-directory: ${{ github.workspace }}/Grade_X_arena_app

      - name: Create Android project & sync
        run: |
          npx cap add android || true
          npx cap sync android
        working-directory: ${{ github.workspace }}/Grade_X_arena_app

      - name: Build test APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: ${{ github.workspace }}/Grade_X_arena_app

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: grade-x-arena-debug-apk
          path: Grade_X_arena_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
